name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tkinter and FUSE libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libfuse2t64 fuse3
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Syntax check
        run: make lint
      - name: Unit tests
        run: make test
